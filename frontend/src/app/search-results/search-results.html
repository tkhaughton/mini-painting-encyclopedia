<section>
    <search-bar></search-bar>
</section>
<section>
    <div class="mt-8 md:w-2/3 mx-4 sm:mx-12" >
        <h1 class="text-3xl">Search Results</h1>
        @for(result of results(); track result.title) {
            <h1 class="text-xl mt-4">
                <a [routerLink]="['/entry/', result.title]">{{ result.title | cleanTitle }}</a>
            </h1>
            <h3 class="text-slate-500">{{ result.type | titlecase }}</h3>
            <p class="line-clamp-2">{{ result.description | cleanDescription }}</p>
        }   @empty {
            <h1 class="mt-2">No Results Found</h1>
        }
