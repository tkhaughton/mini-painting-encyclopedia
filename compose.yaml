services:
  frontend:
    image: encyc-frontend
    build: 
      context: ./frontend
    ports:
      - 80:80
      - 8080:8080
    environment:
      NODE_ENV: production
    networks: 
      - frontend
      - backend
    depends_on:
      backend:
        condition: service_started
  
  backend:
    image: encyc-backend
    build:
      context: ./backend
    volumes:
      - ./instance:/app/instance
    networks: 
      - backend

networks: 
  frontend:
  backend:
